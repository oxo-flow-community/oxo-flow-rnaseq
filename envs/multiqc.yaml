# Environment for MultiQC and the workflow-level custom-content script —
# the multiqc pin is exact to the upstream nf-core/rnaseq 3.28.0 module
# environment (modules/nf-core/multiqc/environment.yml: multiqc=1.35; the
# 3.26.0 tag pinned 1.33). python and rich are port-carried additions, not
# tag-sourced (see the README exceptions table): python is pinned so the
# custom content script (scripts/multiqc_custom_content.py) runs on a known
# interpreter; pyyaml is a MultiQC dependency.
name: multiqc
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12.12
  - bioconda::multiqc=1.35
  - conda-forge::rich=13.9.4
